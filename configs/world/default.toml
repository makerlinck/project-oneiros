# 世界初值（docs/SANDBOX.md §4）。所有数值都是初值，M1 标定后才写进预注册。

[run]
seed = 0
ticks = 200
segment_ticks = 64    # 每段 lax.scan 的 tick 数；K 只影响吞吐，不影响结果

[world]
width = 64.0          # §4.1 平面 64 x 64 单位
height = 64.0
cell = 1.0            # 场的网格：每单位一格
bush_regen_rate = 0.03   # §4.2 浆果再生率（M1 扫描）
bush_regen_base = 1e-4   # §4.2 再生基数（M1 扫描）
temperature_scale = 1.0  # 温差幅度整体倍率（M1 扫描；ramp 另有乘子）
day_ticks = 200.0     # 昼夜周期（ARCHITECTURES.md §3.1 提到 T_day 约 200 tick）
odor_diffusion = 0.2  # §4.3 D = 0.2
odor_decay = 0.02     # §4.3 delta = 0.02
odor_scale = 1000000  # 沉积用定点整数（SANDBOX.md §2 确定性）
founders = 64         # 创始个体数（M1 标定）
ramp_ticks = 0        # §9 起步爬坡：0 表示关闭；M1 标定取值
ramp_berry_multiplier = 3.0       # 爬坡起点：浆果再生倍率
ramp_metabolism_multiplier = 0.2  # 爬坡起点：基础代谢倍率
ramp_temperature_multiplier = 0.2 # 爬坡起点：温差幅度倍率
event_capacity = 2048 # §3.3 定长带掩码事件缓冲
l_ticks = 500.0       # L，M1 标定前的占位值
c_switch = 1.0        # §4.4 T_switch = c_switch * L

[capacities]
creature = 256        # N_max
bush = 60
carcass = 64
neutral = 3

[sensors]
vision_pixels = 15    # §5.6 前向 60 度，每像素 4 度
fov_deg = 60.0
odor_channels = 4     # C_o = 4
touch_channels = 4    # 前、右、后、左
proprio_channels = 2  # v、上一 tick 的实际角速度
interoception_channels = 6  # 胃充盈 1 + 痛觉束 4 + 心跳 1
skin_channels = 1     # 皮肤温差 T - b
light_channels = 1
load_channels = 1     # 负重
efference_channels = 6  # 上一 tick 的 6 个输出
sound_channels = 0    # 第 6 阶段追加 2 x 2

[brain]
kind = "bootstrap"  # M0：随机策略驱动身体（§9）；M2 起为 "plastic_rnn"（§6.4）
h = 32
modulators = 4
# 基因组宽度与快权重宽度由 brain.genome.layout 从 H/D/M/N_OUT 推出，不在此配置。
motion_noise = 0.05

[learning]
plasticity = true
prediction = true
eta_granularity = "per_unit"   # per_unit | per_group | shared
body_loop = true
readable_leak = false

[body]
base_metabolism = 0.002   # §5.3 基础代谢（M1 扫描）
founder_reserves = 0.5    # §5.5 创始储量比例（M1 扫描 0.3-0.5）

[reproduction]
randomize_genome = false  # §9 M1 对照臂：每次出生重新随机化基因组

[motion]
noise_scale = 1.0
